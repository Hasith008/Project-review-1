<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Income — Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="income">
  <div class="app-layout">
    <div id="sidebarMount"></div>
    <main class="main-content">
      <div id="topbarMount"></div>
      <div class="form-page-grid">
        <div class="form-intro-card">
          <div class="eyebrow">Money In</div>
          <h2>Add income</h2>
          <p>Record money you received so your dashboard stays up to date.</p>
        </div>
        <div class="form-panel">
          <div class="eyebrow">New Entry</div>
          <h3>Income details</h3>
          <form id="incomeForm">
            <div class="form-group">
              <label for="incAmount">Amount (₹)</label>
              <input type="number" id="incAmount" placeholder="e.g. 25000" min="1" step="any" required />
            </div>
            <div class="form-group">
              <label for="incCategory">Category</label>
              <select id="incCategory" required></select>
            </div>
            <div class="form-group">
              <label for="incMethod">Payment Method</label>
              <select id="incMethod" required></select>
            </div>
            <div class="form-group">
              <label for="incNote">Note</label>
              <input type="text" id="incNote" placeholder="e.g. Monthly salary" />
            </div>
            <div class="form-group">
              <label for="incDate">Date</label>
              <input type="date" id="incDate" required />
            </div>
            <button type="submit" class="btn-primary">
              Save income <span class="arrow">→</span>
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="js/jwt.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
