<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="admin">
  <div class="app-layout">
    <div id="sidebarMount"></div>

    <main class="main-content">
      <div id="topbarMount"></div>

      <div style="margin-bottom: 8px;">
        <div class="eyebrow" style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#9ca3af;">Admin Module</div>
        <h2 style="font-size:24px;font-weight:700;margin-top:4px;">System overview</h2>
        <p style="color:#6b7280;font-size:14px;margin-top:4px;">Monitor the local Expense Tracker records.</p>
      </div>

      <div class="admin-metrics">
        <div class="admin-metric">
          <div class="label">Users</div>
          <div class="value" id="admUsers">0</div>
        </div>
        <div class="admin-metric">
          <div class="label">Transactions</div>
          <div class="value" id="admTx">0</div>
        </div>
        <div class="admin-metric">
          <div class="label">Total income</div>
          <div class="value" id="admIncome">₹0</div>
        </div>
        <div class="admin-metric">
          <div class="label">Total expenses</div>
          <div class="value" id="admExpense">₹0</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div>
            <div class="eyebrow">User Management</div>
            <h3>Registered users</h3>
          </div>
        </div>
        <table class="users-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Records</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
