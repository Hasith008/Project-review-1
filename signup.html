<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="signup">
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-left">
        <div class="auth-logo">
          <div class="logo-badge">ET</div>
          <span class="logo-text">Expense Tracker</span>
        </div>
        <h1>Build better<br><span>money habits.</span></h1>
        <p>Start tracking your everyday spending with a clean, focused dashboard.</p>
        <div class="auth-stat-card">
          <div class="label">This month</div>
          <div class="value">₹24,580</div>
          <div class="sub">Under budget</div>
          <div class="auth-stat-fab">+</div>
        </div>
      </div>

      <div class="auth-right">
        <div class="eyebrow">Get Started</div>
        <h2>Create account</h2>
        <p class="subtitle">Your data stays in your browser.</p>

        <form id="signupForm">
          <div class="form-group">
            <label for="suName">Full name</label>
            <input type="text" id="suName" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="suEmail">Email</label>
            <input type="email" id="suEmail" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="suPass">Password</label>
            <input type="password" id="suPass" placeholder="Create a password" required />
          </div>
          <div class="error-msg" id="suError"></div>
          <button type="submit" class="btn-primary">
            Create account <span class="arrow">→</span>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="index.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/jwt.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
